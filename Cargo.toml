[workspace]
members = ["crates/core", "crates/daemon", "crates/desktop"]
resolver = "2"
[workspace.package]
version = "0.6.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Nirusaki"]
repository = "https://github.com/Nirusaki-Malaal/PredatorSense"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
predator-core = { path = "crates/core" }
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
